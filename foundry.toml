[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.25"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@flarenetwork/flare-periphery-contracts/=node_modules/@flarenetwork/flare-periphery-contracts/",
]

[rpc_endpoints]
coston2 = "https://coston2-api.flare.network/ext/C/rpc"

[etherscan]
coston2 = { key = "any", url = "https://coston2-explorer.flare.network/api", chain = 114 }

[invariant]
runs = 128
depth = 64
fail_on_revert = false
